<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operations posees — Les Cascades</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #EDE7F6;
    --bg2:       #D1C4E9;
    --panel-bg:  #F3E5F5;
    --accent:    #6A1B9A;
    --accent-d:  #4A148C;
    --accent-l:  #E1BEE7;
    --text:      #1A0E00;
    --text-light:#7A5C20;
    --border:    #CE93D8;
    --border-d:  #9C27B0;
    --white:     #FFFFFF;
    --correct:   #1B5E20;
    --correct-l: #C8E6C9;
    --wrong:     #B71C1C;
    --wrong-l:   #FFCDD2;
    --retenue:   #E53935;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Nunito Sans',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
  }

  /* HEADER */
  .topbar {
    background:var(--accent); padding:.9rem 1.4rem;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px; border-bottom:4px solid var(--accent-d);
  }
  .game-title { font-family:'Nunito',sans-serif; font-size:20px; font-weight:900; color:#fff; }
  .game-sub   { font-size:12px; color:var(--accent-l); font-weight:600; margin-top:2px; }
  .score-pill {
    font-family:'Nunito',sans-serif; font-size:15px; font-weight:800;
    background:#fff; border:2px solid var(--accent-d);
    border-radius:20px; padding:5px 18px; color:var(--accent);
  }

  /* CONFIG */
  .config-panel {
    background:var(--panel-bg); border-bottom:3px solid var(--border-d);
    padding:.8rem 1.4rem; display:flex; flex-wrap:wrap; gap:1.2rem; align-items:flex-start;
  }
  .config-block { display:flex; flex-direction:column; gap:6px; }
  .config-label {
    font-family:'Nunito',sans-serif; font-size:11px; font-weight:800;
    text-transform:uppercase; letter-spacing:.08em; color:var(--text-light);
  }
  .check-row { display:flex; flex-wrap:wrap; gap:6px; }
  .cbox {
    display:flex; align-items:center; gap:5px;
    background:#fff; border:2px solid var(--border-d); border-radius:8px;
    padding:5px 10px; cursor:pointer; transition:all .15s;
    font-family:'Nunito',sans-serif; font-size:12px; font-weight:700; color:var(--text);
    user-select:none;
  }
  .cbox:hover { border-color:var(--accent); }
  .cbox.checked { background:var(--accent); border-color:var(--accent-d); color:#fff; }

  /* MAIN */
  .main { flex:1; padding:1.2rem 1.4rem; display:flex; flex-direction:column; gap:1rem; align-items:center; }

  .feedback {
    display:none; padding:10px 18px; border-radius:10px;
    font-family:'Nunito',sans-serif; font-size:14px; font-weight:800;
    text-align:center; border:2px solid transparent; width:100%; max-width:560px;
  }
  .feedback.ok { background:var(--correct-l); color:var(--correct); border-color:var(--correct); display:block; }
  .feedback.ko { background:var(--wrong-l); color:var(--wrong); border-color:var(--wrong); display:block; }

  /* GRILLE OPERATION */
  .op-wrap {
    background:#fff; border:3px solid var(--border-d); border-radius:16px;
    padding:1.4rem 1.8rem; display:inline-flex; flex-direction:column;
    align-items:flex-end; gap:0; box-shadow:0 4px 16px rgba(106,27,154,.12);
    position:relative;
  }

  /* Ligne de la grille */
  .op-row {
    display:flex; align-items:flex-end; gap:2px;
    position:relative;
  }

  /* Separateur */
  .op-sep {
    width:100%; height:3px; background:var(--text);
    border-radius:2px; margin:6px 0;
  }

  /* Symbole + ou - */
  .op-sym {
    font-family:'Nunito',sans-serif; font-size:32px; font-weight:900;
    color:var(--text); width:36px; text-align:center;
    padding-bottom:4px; align-self:flex-end;
  }

  /* Cellule chiffre */
  .cell-wrap {
    display:flex; flex-direction:column; align-items:center;
    position:relative; width:52px;
  }

  /* Zone retenue HAUT (addition ou compensation soustraction) */
  .ret-top {
    height:26px; width:52px; display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .ret-top .ret-cell {
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Nunito',sans-serif; font-size:14px; font-weight:900;
    cursor:pointer; transition:all .15s; border:2px solid transparent;
  }
  .ret-top .ret-cell.empty { border:2px dashed var(--border); color:transparent; }
  .ret-top .ret-cell.active { border:2px solid var(--accent); background:var(--accent-l); }
  .ret-top .ret-cell.filled-add {
    border:2.5px solid var(--retenue); color:var(--retenue);
    background:#FFF3F3; font-size:13px;
  }
  .ret-top .ret-cell.filled-sub {
    border:2.5px solid var(--retenue); color:var(--retenue);
    background:#FFF3F3; font-size:13px;
  }
  .ret-top .ret-cell.correct-ret { border-color:var(--correct); background:var(--correct-l); color:var(--correct); }
  .ret-top .ret-cell.wrong-ret   { border-color:var(--wrong);   background:var(--wrong-l);   color:var(--wrong); }

  /* Chiffre principal */
  .main-cell {
    width:52px; height:56px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Nunito',sans-serif; font-size:32px; font-weight:900; color:var(--text);
    border-radius:8px; transition:all .15s; position:relative;
  }
  .main-cell.input {
    border:2px dashed var(--border-d); cursor:pointer;
    background:var(--panel-bg);
  }
  .main-cell.input:hover { border-color:var(--accent); background:var(--accent-l); }
  .main-cell.input.active {
    border:3px solid var(--accent); background:var(--accent-l);
    box-shadow:0 0 0 3px rgba(106,27,154,.2);
  }
  .main-cell.input.filled { border-style:solid; border-color:var(--border-d); background:var(--bg2); }
  .main-cell.correct { border-color:var(--correct)!important; background:var(--correct-l)!important; color:var(--correct); border-style:solid!important; }
  .main-cell.wrong   { border-color:var(--wrong)!important;   background:var(--wrong-l)!important;   color:var(--wrong);   border-style:solid!important; }

  /* Retenue BAS soustraction (petit chiffre bas gauche) */
  .ret-bot {
    height:20px; width:52px; display:flex; align-items:center; justify-content:flex-start;
    padding-left:3px;
  }
  .ret-bot .rbot-cell {
    width:20px; height:20px; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Nunito',sans-serif; font-size:12px; font-weight:900;
    cursor:pointer; transition:all .15s; border:2px dashed var(--border);
    color:transparent;
  }
  .rbot-cell.active   { border:2px solid var(--accent); background:var(--accent-l); }
  .rbot-cell.filled   { border:2px solid var(--retenue); color:var(--retenue); background:#FFF3F3; }
  .rbot-cell.correct-ret { border-color:var(--correct); background:var(--correct-l); color:var(--correct); }
  .rbot-cell.wrong-ret   { border-color:var(--wrong);   background:var(--wrong-l);   color:var(--wrong); }

  /* Espace vide pour aligner */
  .ret-empty { height:26px; width:52px; }
  .ret-bot-empty { height:20px; width:52px; }

  /* PAVÉ NUMÉRIQUE */
  .keypad-wrap {
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .keypad-hint {
    font-family:'Nunito',sans-serif; font-size:12px; font-weight:700;
    color:var(--text-light);
  }
  .keypad {
    display:grid; grid-template-columns:repeat(5,1fr); gap:8px;
    background:#fff; border:3px solid var(--border-d); border-radius:14px;
    padding:12px; box-shadow:0 2px 8px rgba(0,0,0,.08);
  }
  .key {
    font-family:'Nunito',sans-serif; font-size:20px; font-weight:900;
    width:52px; height:52px; border-radius:10px;
    border:2px solid var(--border-d); background:var(--panel-bg); color:var(--text);
    cursor:pointer; transition:all .15s;
    display:flex; align-items:center; justify-content:center;
  }
  .key:hover { background:var(--accent-l); border-color:var(--accent); transform:scale(1.06); }
  .key.del { background:var(--wrong-l); border-color:var(--wrong); color:var(--wrong); font-size:16px; }
  .key.del:hover { background:var(--wrong); color:#fff; }
  .key.disabled { opacity:.3; pointer-events:none; }

  /* CONTROLS */
  .controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding-bottom:.5rem; }
  .btn {
    font-family:'Nunito',sans-serif; font-size:13px; font-weight:800;
    padding:10px 22px; border-radius:10px; border:2px solid var(--border-d);
    background:#fff; color:var(--text); cursor:pointer; transition:all .15s;
  }
  .btn:hover { background:var(--bg2); border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent-d); color:#fff; }
  .btn.primary:hover { background:var(--accent-d); }
  .btn.check { background:#1565C0; border-color:#0D47A1; color:#fff; }
  .btn.check:hover { background:#0D47A1; }

  /* PHASE POSER */
  .poser-wrap {
    display:flex; flex-direction:column; align-items:center; gap:12px;
  }
  .poser-instruction {
    font-family:'Nunito',sans-serif; font-size:14px; font-weight:700;
    color:var(--text-light); text-align:center;
    background:var(--panel-bg); border:2px solid var(--border);
    border-radius:8px; padding:8px 16px;
  }
  .poser-display {
    font-family:'Nunito',sans-serif; font-size:28px; font-weight:900;
    color:var(--accent); letter-spacing:.04em;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="game-title">Operations posees</div>
    <div class="game-sub">Addition et soustraction avec retenues</div>
  </div>
  <span class="score-pill" id="score-lbl">Score : 0 / 0</span>
</div>

<div class="config-panel">

  <div class="config-block">
    <div class="config-label">Operation</div>
    <div class="check-row">
      <div class="cbox checked" id="cb-add" onclick="toggleOp('add',this)">Addition</div>
      <div class="cbox checked" id="cb-sub" onclick="toggleOp('sub',this)">Soustraction</div>
    </div>
  </div>

  <div class="config-block">
    <div class="config-label">Nombres</div>
    <div class="check-row">
      <div class="cbox checked" id="cb-2c" onclick="toggleChiffres(2,this)">2 chiffres</div>
      <div class="cbox" id="cb-3c" onclick="toggleChiffres(3,this)">3 chiffres</div>
    </div>
  </div>

  <div class="config-block">
    <div class="config-label">Retenues</div>
    <div class="check-row">
      <div class="cbox checked" id="cb-ret" onclick="toggleCbox('ret',this)">Gerer les retenues</div>
    </div>
  </div>

  <div class="config-block">
    <div class="config-label">Poser l'operation</div>
    <div class="check-row">
      <div class="cbox" id="cb-poser" onclick="toggleCbox('poser',this)">Poser soi-meme</div>
    </div>
  </div>

</div>

<div class="main">
  <div class="feedback" id="feedback"></div>
  <div style="display:flex; gap:2rem; align-items:center; justify-content:center; flex-wrap:wrap;">
    <div id="game-zone"></div>
    <div class="keypad-wrap" id="keypad-wrap">
      <div class="keypad-hint" id="keypad-hint">Clique une case puis un chiffre</div>
      <div class="keypad" id="keypad"></div>
    </div>
  </div>
  <div class="controls">
    <button class="btn check" onclick="checkAll()">✔ Verifier</button>
    <button class="btn"       onclick="resetRound()">↺ Reessayer</button>
    <button class="btn primary" onclick="newGame()">→ Nouvel exercice</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  CONFIG STATE
// ═══════════════════════════════════════════
let ops       = ['add','sub'];
let nbChiffres = 2;
let avecRetenue = true;
let poserSoiMeme = false;
let score = 0, total = 0;

// ═══════════════════════════════════════════
//  EXERCISE STATE
// ═══════════════════════════════════════════
let op = 'add';    // 'add' ou 'sub'
let numA = 0, numB = 0, result = 0;
let digits = [];   // chiffres de A, B, result par colonne droite→gauche
let nCols = 0;

// Cellules interactives : tableau indexé
// type: 'result' | 'ret-top' | 'ret-bot'
// col: 0=unites, 1=dizaines, 2=centaines
let cells = [];    // [{type, col, value, correct, active}]
let activeCell = null; // index dans cells
let locked = false;

// Phase poser
let phasePose = false; // true = on pose d'abord
let poseCells = [];    // cases à remplir pour poser

// ═══════════════════════════════════════════
//  CONFIG TOGGLES
// ═══════════════════════════════════════════
function toggleOp(op, el) {
  if (ops.includes(op) && ops.length === 1) return; // garder au moins 1
  ops = ops.includes(op) ? ops.filter(x=>x!==op) : [...ops, op];
  el.classList.toggle('checked', ops.includes(op));
}
function toggleChiffres(n, el) {
  nbChiffres = n;
  document.getElementById('cb-2c').classList.toggle('checked', n===2);
  document.getElementById('cb-3c').classList.toggle('checked', n===3);
}
function toggleCbox(key, el) {
  if (key==='ret') { avecRetenue=!avecRetenue; el.classList.toggle('checked',avecRetenue); }
  if (key==='poser') { poserSoiMeme=!poserSoiMeme; el.classList.toggle('checked',poserSoiMeme); }
}

// ═══════════════════════════════════════════
//  GENERATION
// ═══════════════════════════════════════════
function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function genAddition() {
  // Garantir au moins une retenue si avecRetenue
  let a,b;
  const max = nbChiffres===2?99:999;
  const min = nbChiffres===2?10:100;
  for(let t=0;t<200;t++){
    a=rnd(min,max); b=rnd(min,max);
    if(a+b>max) continue; // eviter depassement
    if(!avecRetenue) break;
    // Verifier retenue colonne unites ou dizaines
    const hasRetU = (a%10)+(b%10)>=10;
    const hasRetD = nbChiffres===3 ? Math.floor((a%100)/10)+Math.floor((b%100)/10)>=10 : false;
    if(hasRetU||hasRetD) break;
  }
  return {a,b,res:a+b,op:'add'};
}

function genSoustraction() {
  let a,b;
  const max = nbChiffres===2?99:999;
  const min = nbChiffres===2?10:100;
  for(let t=0;t<200;t++){
    a=rnd(min,max); b=rnd(Math.floor(min/2),a-1);
    if(b<1) continue;
    if(!avecRetenue) break;
    const hasRetU = (a%10)<(b%10);
    const hasRetD = nbChiffres===3 ? Math.floor((a%100)/10)<Math.floor((b%100)/10) : false;
    if(hasRetU||hasRetD) break;
  }
  return {a,b,res:a-b,op:'sub'};
}

function getDigits(n, cols) {
  const d=[];
  for(let i=0;i<cols;i++){d.push(n%10);n=Math.floor(n/10);}
  return d; // index 0=unites
}

// ═══════════════════════════════════════════
//  INIT GAME
// ═══════════════════════════════════════════
function newGame() {
  hideFeedback(); locked=false; activeCell=null; phasePose=false;

  const chosenOp = ops[Math.floor(Math.random()*ops.length)];
  const ex = chosenOp==='add' ? genAddition() : genSoustraction();
  op=ex.op; numA=ex.a; numB=ex.b; result=ex.res;
  nCols = nbChiffres;

  if(poserSoiMeme) {
    initPose();
  } else {
    initCalcul();
  }
  buildKeypad();
}

// ── PHASE POSER ──────────────────────────
function initPose() {
  phasePose=true;
  poseCells=[];
  // L'eleve doit remplir les chiffres de A et B dans la grille
  const dA=getDigits(numA,nCols), dB=getDigits(numB,nCols);
  for(let c=nCols-1;c>=0;c--){
    poseCells.push({col:c,row:'A',correct:dA[c],value:null,active:false});
    poseCells.push({col:c,row:'B',correct:dB[c],value:null,active:false});
  }
  renderPose();
}

function renderPose() {
  const sym = op==='add'?'+':'−';
  const colsHtml = Array.from({length:nCols},(_,i)=>nCols-1-i).map(col=>{
    const cA=poseCells.find(c=>c.col===col&&c.row==='A');
    const cB=poseCells.find(c=>c.col===col&&c.row==='B');
    const idxA=poseCells.indexOf(cA), idxB=poseCells.indexOf(cB);
    const cellA=`<div class="main-cell input${cA.active?' active':''}${cA.value!==null?' filled':''}"
      onclick="activePoseCell(${idxA})">${cA.value!==null?cA.value:''}</div>`;
    const cellB=`<div class="main-cell input${cB.active?' active':''}${cB.value!==null?' filled':''}"
      onclick="activePoseCell(${idxB})">${cB.value!==null?cB.value:''}</div>`;
    return `<div class="cell-wrap"><div class="ret-empty"></div>${cellA}<div class="ret-bot-empty"></div></div>
            <div style="display:none">${cellB}</div>`;
  }).join('');

  // Ligne A et ligne B séparément
  const rowA = Array.from({length:nCols},(_,i)=>nCols-1-i).map(col=>{
    const c=poseCells.find(x=>x.col===col&&x.row==='A');
    const idx=poseCells.indexOf(c);
    return `<div class="cell-wrap">
      <div class="ret-empty"></div>
      <div class="main-cell input${c.active?' active':''}${c.value!==null?' filled':''}"
        onclick="activePoseCell(${idx})">${c.value!==null?c.value:''}</div>
      <div class="ret-bot-empty"></div>
    </div>`;
  }).join('');

  const rowB = Array.from({length:nCols},(_,i)=>nCols-1-i).map(col=>{
    const c=poseCells.find(x=>x.col===col&&x.row==='B');
    const idx=poseCells.indexOf(c);
    return `<div class="cell-wrap">
      <div class="ret-empty"></div>
      <div class="main-cell input${c.active?' active':''}${c.value!==null?' filled':''}"
        onclick="activePoseCell(${idx})">${c.value!==null?c.value:''}</div>
      <div class="ret-bot-empty"></div>
    </div>`;
  }).join('');

  document.getElementById('game-zone').innerHTML = `
    <div class="poser-wrap">
      <div class="poser-instruction">Pose cette operation dans la grille :</div>
      <div class="poser-display">${numA} ${op==='add'?'+':'−'} ${numB}</div>
      <div class="op-wrap">
        <div class="op-row">${rowA}</div>
        <div class="op-row">
          <div class="op-sym">${sym}</div>
          ${rowB}
        </div>
        <div class="op-sep"></div>
        <div class="op-row">
          ${Array.from({length:nCols},(_,i)=>nCols-1-i).map(col=>`
            <div class="cell-wrap">
              <div class="ret-empty"></div>
              <div class="main-cell" style="background:var(--panel-bg);border:2px dashed var(--border)"></div>
              <div class="ret-bot-empty"></div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
  document.getElementById('keypad-hint').textContent='Clique une case puis un chiffre pour poser l\'operation';
}

function activePoseCell(idx) {
  poseCells.forEach((c,i)=>c.active=i===idx);
  activeCell={type:'pose',idx};
  renderPose();
}

function checkPose() {
  const allFilled = poseCells.every(c=>c.value!==null);
  if(!allFilled){showFeedback('Complete toutes les cases avant de valider !','ko');return;}
  const ok = poseCells.every(c=>c.value===c.correct);
  if(ok){
    showFeedback('Bien pose ! Maintenant calcule le resultat.','ok');
    setTimeout(()=>{hideFeedback();phasePose=false;initCalcul();},1200);
  } else {
    showFeedback('Verifie le placement des chiffres — certaines cases sont incorrectes.','ko');
  }
}

// ── PHASE CALCUL ─────────────────────────
function initCalcul() {
  phasePose=false;
  cells=[];
  locked=false; activeCell=null;

  const dA=getDigits(numA,nCols);
  const dB=getDigits(numB,nCols);
  const dR=getDigits(result,nCols);

  // Calculer les retenues correctes
  const retTopCorrect=Array(nCols).fill(0);
  const retBotCorrect=Array(nCols).fill(0);

  if(op==='add') {
    let carry=0;
    for(let c=0;c<nCols;c++){
      const sum=dA[c]+dB[c]+carry;
      carry=sum>=10?1:0;
      if(c<nCols-1) retTopCorrect[c+1]=carry;
    }
  } else {
    // Compensation : retenue haut = +10 sur chiffre haut, retenue bas = +1 dizaine sur chiffre bas
    for(let c=0;c<nCols-1;c++){
      const aD=dA[c], bD=dB[c];
      if(aD<bD){ retTopCorrect[c]=1; retBotCorrect[c+1]=1; }
      // Avec retenue bas deja appliquee
      else if(c>0 && retBotCorrect[c]===1){
        const bAdj=bD+retBotCorrect[c];
        const aAdj=aD+(retTopCorrect[c]?10:0);
        if(aAdj<bAdj){ retTopCorrect[c]=1; retBotCorrect[c+1]=1; }
      }
    }
  }

  // Construire les cellules
  for(let c=0;c<nCols;c++){
    // Retenue top (addition: chiffre porté | soustraction: cercle +10)
    if(avecRetenue && c>0){
      cells.push({type:'ret-top', col:c,
        correct: op==='add' ? retTopCorrect[c] : retTopCorrect[c-1] ? 1 : 0,
        value:null, active:false});
    }
    // Résultat
    cells.push({type:'result', col:c, correct:dR[c], value:null, active:false});
    // Retenue bas (soustraction uniquement)
    if(avecRetenue && op==='sub' && c<nCols-1){
      cells.push({type:'ret-bot', col:c,
        correct:retBotCorrect[c+1],
        value:null, active:false});
    }
  }

  renderCalcul();
}

function renderCalcul() {
  const dA=getDigits(numA,nCols);
  const dB=getDigits(numB,nCols);
  const sym=op==='add'?'+':'−';

  const colsHtml = Array.from({length:nCols},(_,i)=>nCols-1-i).map(col=>{
    // Ret top
    let retTopHtml='<div class="ret-empty"></div>';
    if(avecRetenue && col>0){
      const c=cells.find(x=>x.type==='ret-top'&&x.col===col);
      if(c){
        const idx=cells.indexOf(c);
        let cls='ret-cell';
        if(locked) cls+=c.value===c.correct?' correct-ret':' wrong-ret';
        else if(c.active) cls+=' active';
        else if(c.value!==null) cls+=(op==='add'?' filled-add':' filled-sub');
        else cls+=' empty';
        retTopHtml=`<div class="ret-top"><div class="${cls}" onclick="activateCell(${idx})">${c.value!==null?c.value:''}</div></div>`;
      }
    }

    // Chiffres A et B (fixes)
    const aD=dA[col], bD=dB[col];

    // Cellule résultat
    const cr=cells.find(x=>x.type==='result'&&x.col===col);
    const idxR=cells.indexOf(cr);
    let clsR='main-cell input';
    if(locked) clsR+=(cr.value===cr.correct?' correct':' wrong');
    else if(cr.active) clsR+=' active';
    else if(cr.value!==null) clsR+=' filled';

    // Ret bas (soustraction)
    let retBotHtml='<div class="ret-bot-empty"></div>';
    if(avecRetenue && op==='sub' && col<nCols-1){
      const cb=cells.find(x=>x.type==='ret-bot'&&x.col===col);
      if(cb){
        const idx=cells.indexOf(cb);
        let cls='rbot-cell';
        if(locked) cls+=cb.value===cb.correct?' correct-ret':' wrong-ret';
        else if(cb.active) cls+=' active';
        else if(cb.value!==null) cls+=' filled';
        retBotHtml=`<div class="ret-bot"><div class="${cls}" onclick="activateCell(${idx})">${cb.value!==null?cb.value:''}</div></div>`;
      }
    }

    return `<div class="cell-wrap">
      ${retTopHtml}
      <div class="main-cell" style="font-size:32px;font-family:Nunito,sans-serif;font-weight:900">${aD}</div>
      ${retBotHtml}
    </div>`;
  }).join('');

  const colsBHtml = Array.from({length:nCols},(_,i)=>nCols-1-i).map(col=>{
    const bD=dB[col];
    return `<div class="cell-wrap">
      <div class="ret-empty"></div>
      <div class="main-cell" style="font-size:32px;font-family:Nunito,sans-serif;font-weight:900">${bD}</div>
      <div class="ret-bot-empty"></div>
    </div>`;
  }).join('');

  const colsResHtml = Array.from({length:nCols},(_,i)=>nCols-1-i).map(col=>{
    const cr=cells.find(x=>x.type==='result'&&x.col===col);
    const idx=cells.indexOf(cr);
    let cls='main-cell input';
    if(locked) cls+=(cr.value===cr.correct?' correct':' wrong');
    else if(cr.active) cls+=' active';
    else if(cr.value!==null) cls+=' filled';
    return `<div class="cell-wrap">
      <div class="ret-empty"></div>
      <div class="${cls}" onclick="activateCell(${idx})">${cr.value!==null?cr.value:''}</div>
      <div class="ret-bot-empty"></div>
    </div>`;
  }).join('');

  document.getElementById('game-zone').innerHTML=`
    <div class="op-wrap">
      <div class="op-row">${colsHtml}</div>
      <div class="op-row"><div class="op-sym">${sym}</div>${colsBHtml}</div>
      <div class="op-sep"></div>
      <div class="op-row">${colsResHtml}</div>
    </div>`;
}

function activateCell(idx) {
  if(locked) return;
  cells.forEach((c,i)=>c.active=i===idx);
  activeCell={type:'calc',idx};
  renderCalcul();
}

// ═══════════════════════════════════════════
//  PAVÉ NUMÉRIQUE
// ═══════════════════════════════════════════
function buildKeypad() {
  const keys=[1,2,3,4,5,6,7,8,9,0,'⌫'];
  document.getElementById('keypad').innerHTML=keys.map(k=>`
    <div class="key${k==='⌫'?' del':''}" onclick="pressKey('${k}')">${k}</div>
  `).join('');
}

function pressKey(k) {
  if(locked) return;

  // Mode pose
  if(phasePose && activeCell && activeCell.type==='pose') {
    const c=poseCells[activeCell.idx];
    if(k==='⌫') c.value=null;
    else c.value=parseInt(k);
    // Avancer automatiquement
    if(k!=='⌫') autoNextPose();
    renderPose(); return;
  }

  // Mode calcul
  if(!activeCell || activeCell.type!=='calc') return;
  const c=cells[activeCell.idx];
  if(!c) return;

  if(k==='⌫') { c.value=null; c.active=true; }
  else {
    const v=parseInt(k);
    // Retenues : seulement 0 ou 1
    if(c.type==='ret-top'||c.type==='ret-bot'){
      if(v>1) return;
      c.value=v;
    } else {
      c.value=v;
    }
    autoNextCalc();
  }
  renderCalcul();
}

function autoNextPose() {
  const idx=activeCell.idx;
  const next=poseCells.findIndex((c,i)=>i>idx&&c.value===null);
  if(next!==-1){poseCells.forEach((c,i)=>c.active=i===next);activeCell.idx=next;}
}

function autoNextCalc() {
  const idx=activeCell.idx;
  // Trouver prochaine case résultat vide
  const next=cells.findIndex((c,i)=>i>idx&&c.type==='result'&&c.value===null);
  if(next!==-1){cells.forEach((c,i)=>c.active=i===next);activeCell.idx=next;}
}

// ═══════════════════════════════════════════
//  CHECK
// ═══════════════════════════════════════════
function checkAll() {
  if(phasePose){ checkPose(); return; }
  if(locked) return;

  const resultCells=cells.filter(c=>c.type==='result');
  if(resultCells.some(c=>c.value===null)){
    showFeedback('Complete toutes les cases du resultat avant de verifier !','ko'); return;
  }

  locked=true;
  const okResult=resultCells.every(c=>c.value===c.correct);

  let okRetenues=true;
  if(avecRetenue){
    const retCells=cells.filter(c=>c.type!=='result');
    // Retenues vides = 0 par defaut
    retCells.forEach(c=>{ if(c.value===null)c.value=0; });
    okRetenues=retCells.every(c=>c.value===c.correct);
  }

  total++;
  if(okResult&&okRetenues){
    score++;
    showFeedback(`Bravo ! ${numA} ${op==='add'?'+':'-'} ${numB} = ${result}`, 'ok');
  } else if(okResult&&!okRetenues){
    score++;
    showFeedback(`Bon resultat ! Verifie les retenues (en rouge).`, 'ok');
  } else {
    showFeedback(`Pas tout a fait — le resultat correct est ${result}.`, 'ko');
  }
  updateScore();
  renderCalcul();
}

function resetRound() {
  locked=false; activeCell=null;
  hideFeedback();
  if(poserSoiMeme) initPose();
  else { cells.forEach(c=>{c.value=null;c.active=false;}); renderCalcul(); }
}

function updateScore(){document.getElementById('score-lbl').textContent=`Score : ${score} / ${total}`;}
function showFeedback(m,t){const f=document.getElementById('feedback');f.textContent=m;f.className='feedback '+t;}
function hideFeedback(){const f=document.getElementById('feedback');f.className='feedback';f.textContent='';}

// ═══════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════
newGame();
</script>
