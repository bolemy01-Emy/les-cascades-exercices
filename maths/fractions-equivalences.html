<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractions — Equivalences — Les Cascades</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #EDE7F6;
    --bg2:       #D1C4E9;
    --panel-bg:  #F3E5F5;
    --accent:    #6A1B9A;
    --accent-d:  #4A148C;
    --accent-l:  #E1BEE7;
    --text:      #1A0E00;
    --text-light:#7A5C20;
    --border:    #CE93D8;
    --border-d:  #9C27B0;
    --white:     #FFFFFF;
    --correct:   #1B5E20;
    --correct-l: #C8E6C9;
    --wrong:     #B71C1C;
    --wrong-l:   #FFCDD2;
    --paired-bg: #E8EAF6;
    --paired-border: #3949AB;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:'Nunito Sans',sans-serif;
    background:var(--bg); color:var(--text);
    min-height:100vh; display:flex; flex-direction:column;
  }

  /* HEADER */
  .topbar {
    background:var(--accent); padding:.9rem 1.4rem;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px; border-bottom:4px solid var(--accent-d);
  }
  .game-title { font-family:'Nunito',sans-serif; font-size:20px; font-weight:900; color:#fff; }
  .game-sub   { font-size:12px; color:var(--accent-l); font-weight:600; margin-top:2px; }
  .score-pill {
    font-family:'Nunito',sans-serif; font-size:15px; font-weight:800;
    background:#fff; border:2px solid var(--accent-d);
    border-radius:20px; padding:5px 18px; color:var(--accent);
  }

  /* CONFIG */
  .config-panel {
    background:var(--panel-bg); border-bottom:3px solid var(--border-d);
    padding:.8rem 1.4rem; display:flex; flex-wrap:wrap; gap:1.4rem; align-items:flex-start;
  }
  .config-block { display:flex; flex-direction:column; gap:7px; }
  .config-label {
    font-family:'Nunito',sans-serif; font-size:11px; font-weight:800;
    text-transform:uppercase; letter-spacing:.08em; color:var(--text-light);
  }
  .check-row { display:flex; flex-wrap:wrap; gap:6px; }
  .cbox {
    display:flex; align-items:center; gap:5px;
    background:#fff; border:2px solid var(--border-d); border-radius:8px;
    padding:5px 10px; cursor:pointer; transition:all .15s;
    font-family:'Nunito',sans-serif; font-size:12px; font-weight:700; color:var(--text);
    user-select:none;
  }
  .cbox:hover { border-color:var(--accent); }
  .cbox.checked { background:var(--accent); border-color:var(--accent-d); color:#fff; }
  .nb-row { display:flex; gap:6px; }
  .nb-btn {
    font-family:'Nunito',sans-serif; font-size:13px; font-weight:800;
    width:36px; height:36px; border-radius:8px;
    border:2px solid var(--border-d); background:#fff; color:var(--text);
    cursor:pointer; transition:all .15s;
    display:flex; align-items:center; justify-content:center;
  }
  .nb-btn:hover { border-color:var(--accent); }
  .nb-btn.active { background:var(--accent); border-color:var(--accent-d); color:#fff; }

  /* MAIN */
  .main { flex:1; padding:1rem 1.4rem; display:flex; flex-direction:column; gap:.9rem; }

  .feedback {
    display:none; padding:10px 18px; border-radius:10px;
    font-family:'Nunito',sans-serif; font-size:14px; font-weight:800;
    text-align:center; border:2px solid transparent;
  }
  .feedback.ok { background:var(--correct-l); color:var(--correct); border-color:var(--correct); display:block; }
  .feedback.ko { background:var(--wrong-l); color:var(--wrong); border-color:var(--wrong); display:block; }
  .config-error {
    display:none; text-align:center; padding:10px;
    font-family:'Nunito',sans-serif; font-size:14px; font-weight:800; color:var(--wrong);
  }

  .instruction {
    text-align:center; font-family:'Nunito',sans-serif; font-size:13px; font-weight:700;
    color:var(--text-light); background:var(--panel-bg);
    border:2px solid var(--border); border-radius:8px; padding:7px 14px;
  }

  /* MESSAGE EQUIVALENCE */
  .equiv-msg {
    text-align:center; font-family:'Nunito',sans-serif; font-size:14px; font-weight:800;
    color:var(--paired-border); background:var(--paired-bg);
    border:2px solid var(--paired-border); border-radius:8px;
    padding:8px 16px; display:none; margin:0 auto; max-width:500px;
  }
  .equiv-msg.show { display:block; }

  /* PANNEAU AIDE */
  .aide-panel {
    display:none; background:#FFF8E1; border:2px solid #F9A825;
    border-radius:12px; padding:12px 16px;
    font-family:'Nunito',sans-serif; font-size:13px; font-weight:700; color:#5D4037;
    max-width:520px; margin:0 auto; text-align:center;
  }
  .aide-panel.show { display:block; }
  .aide-level {
    font-size:11px; font-weight:800; text-transform:uppercase;
    letter-spacing:.06em; color:#F9A825; margin-bottom:6px;
  }
  .aide-text { line-height:1.6; }
  .aide-figure { margin:10px auto 4px; display:flex; justify-content:center; }
  .aide-figure svg { display:block; }

  /* GRILLE CARTES */
  .cards-grid {
    display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:flex-start;
  }

  /* CARTE */
  .frac-card {
    display:flex; flex-direction:column; align-items:center; gap:8px;
    background:#fff; border:3px solid var(--border-d); border-radius:14px;
    padding:12px 10px; cursor:pointer; transition:all .18s;
    user-select:none; width:140px; position:relative;
  }
  .frac-card:hover { border-color:var(--accent); box-shadow:0 4px 14px rgba(106,27,154,.18); transform:translateY(-2px); }
  .frac-card.selected {
    border-color:var(--accent); background:var(--accent-l);
    box-shadow:0 0 0 4px rgba(106,27,154,.25); transform:scale(1.04);
  }
  .frac-card.paired {
    border-color:var(--paired-border); background:var(--paired-bg);
    cursor:default; pointer-events:none; opacity:.85;
  }
  .frac-card.wrong-flash { border-color:var(--wrong); background:var(--wrong-l); }

  /* Bande dans la carte */
  .card-figure {
    width:116px; height:44px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel-bg); border:1.5px solid var(--border);
    border-radius:8px; overflow:hidden;
  }
  .card-figure svg { width:110px; height:38px; display:block; overflow:hidden; }

  /* Ecriture fractionnaire */
  .frac-write { display:flex; flex-direction:column; align-items:center; padding:2px 0; }
  .frac-write .fn {
    font-family:'Nunito',sans-serif; font-size:22px; font-weight:900; color:var(--text);
    border-bottom:3px solid var(--text); line-height:1.2;
    padding:0 10px 2px; width:100%; text-align:center;
  }
  .frac-write .fd {
    font-family:'Nunito',sans-serif; font-size:22px; font-weight:900; color:var(--text);
    line-height:1.2; padding:2px 10px 0; width:100%; text-align:center;
  }

  /* Badge paire */
  .pair-badge {
    position:absolute; top:-10px; right:-10px;
    width:22px; height:22px; background:var(--paired-border);
    border-radius:50%; display:none;
    align-items:center; justify-content:center;
    font-size:12px; color:#fff; font-weight:900;
  }
  .frac-card.paired .pair-badge { display:flex; }

  /* CONTROLS */
  .controls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding-bottom:.5rem; }
  .btn {
    font-family:'Nunito',sans-serif; font-size:13px; font-weight:800;
    padding:10px 22px; border-radius:10px; border:2px solid var(--border-d);
    background:#fff; color:var(--text); cursor:pointer; transition:all .15s;
  }
  .btn:hover { background:var(--bg2); border-color:var(--accent); }
  .btn.primary { background:var(--accent); border-color:var(--accent-d); color:#fff; }
  .btn.primary:hover { background:var(--accent-d); }
  .btn.aide {
    background:#FFF8E1; border-color:#F9A825; color:#5D4037;
    display:none;
  }
  .btn.aide:hover { background:#FFF3CD; }
  .btn.aide.visible { display:inline-flex; align-items:center; gap:6px; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="game-title">Fractions equivalentes</div>
    <div class="game-sub">Trouve les fractions qui representent la meme quantite</div>
  </div>
  <span class="score-pill" id="score-lbl">Score : 0 / 0</span>
</div>

<div class="config-panel">
  <div class="config-block">
    <div class="config-label">Familles de fractions</div>
    <div class="check-row" id="families-row"></div>
  </div>
  <div class="config-block">
    <div class="config-label">Nombre de paires</div>
    <div class="nb-row">
      <button class="nb-btn"        onclick="setNb(2,this)">2</button>
      <button class="nb-btn active" onclick="setNb(3,this)">3</button>
      <button class="nb-btn"        onclick="setNb(4,this)">4</button>
    </div>
  </div>
</div>

<div class="main">
  <div class="feedback"     id="feedback"></div>
  <div class="config-error" id="config-error"></div>
  <div class="equiv-msg"    id="equiv-msg"></div>

  <!-- PANNEAU AIDE -->
  <div class="aide-panel" id="aide-panel">
    <div class="aide-level" id="aide-level"></div>
    <div class="aide-text"  id="aide-text"></div>
    <div class="aide-figure" id="aide-figure"></div>
  </div>

  <div class="instruction">Appuie sur deux fractions pour les associer &mdash; trouve toutes les paires egales !</div>
  <div class="cards-grid" id="cards-grid"></div>

  <div class="controls">
    <button class="btn aide visible" id="btn-aide" onclick="showAide()">💡 Aide</button>
    <button class="btn"         onclick="resetRound()">Reessayer</button>
    <button class="btn primary" onclick="newGame()">Nouvel exercice</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  FAMILLES
// ═══════════════════════════════════════════
const FAMILIES = [
  { id:'demis',       label:'Demis (1/2)',       ref:'un demi',       refFrac:{n:1,d:2}, fracs:[{n:1,d:2},{n:2,d:4},{n:3,d:6},{n:4,d:8},{n:5,d:10}] },
  { id:'quarts',      label:'Quarts (1/4)',       ref:'un quart',      refFrac:{n:1,d:4}, fracs:[{n:1,d:4},{n:2,d:8},{n:3,d:12}] },
  { id:'tiers',       label:'Tiers (1/3)',        ref:'un tiers',      refFrac:{n:1,d:3}, fracs:[{n:1,d:3},{n:2,d:6},{n:4,d:12}] },
  { id:'trois-quarts',label:'Trois quarts (3/4)', ref:'trois quarts',  refFrac:{n:3,d:4}, fracs:[{n:3,d:4},{n:6,d:8},{n:9,d:12}] },
  { id:'deux-tiers',  label:'Deux tiers (2/3)',   ref:'deux tiers',    refFrac:{n:2,d:3}, fracs:[{n:2,d:3},{n:4,d:6},{n:8,d:12}] },
  { id:'entier',      label:'Entier (1)',          ref:'un entier',     refFrac:{n:1,d:1}, fracs:[{n:2,d:2},{n:3,d:3},{n:4,d:4},{n:6,d:6}] },
];

const FILL='#6A1B9A', EMPTY='#F3E5F5', STR='#4A148C';

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let activeFamilies = ['demis','quarts'];
let nbPaires = 3;
let cards = [];
let selected = null;
let pairsFound = 0;
let score = 0, total = 0;
let aideLevel = 0; // 0=pas affichee, 1,2,3

// ═══════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════
function buildFamiliesPanel() {
  document.getElementById('families-row').innerHTML = FAMILIES.map(f => {
    const on = activeFamilies.includes(f.id);
    return `<div class="cbox${on?' checked':''}" onclick="toggleFamily('${f.id}',this)">${f.label}</div>`;
  }).join('');
}
function toggleFamily(id, el) {
  activeFamilies = activeFamilies.includes(id)
    ? activeFamilies.filter(x => x !== id)
    : [...activeFamilies, id];
  el.classList.toggle('checked', activeFamilies.includes(id));
}
function setNb(n, el) {
  nbPaires = n;
  document.querySelectorAll('.nb-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

// ═══════════════════════════════════════════
//  GAME
// ═══════════════════════════════════════════
function shuffle(a) { return [...a].sort(() => Math.random() - .5); }

function newGame() {
  hideFeedback(); hideEquivMsg(); hideAide();
  selected = null; pairsFound = 0; aideLevel = 0;

  const available = FAMILIES.filter(f => activeFamilies.includes(f.id));
  if (!available.length) {
    showError('Coche au moins une famille de fractions !');
    document.getElementById('cards-grid').innerHTML = '';
    return;
  }
  hideError();

  // Choisir les familles pour cet exercice
  let chosenFamilies = shuffle(available).slice(0, Math.min(nbPaires, available.length));
  while (chosenFamilies.length < nbPaires) chosenFamilies.push(shuffle(available)[0]);

  // Creer les cartes — 2 fractions differentes par famille
  cards = [];
  let cardId = 0;
  chosenFamilies.forEach((fam, pairIdx) => {
    const picked = shuffle(fam.fracs).slice(0, 2);
    picked.forEach(frac => {
      cards.push({
        id: cardId++,
        n: frac.n, d: frac.d,
        familyId: fam.id,
        familyRef: fam.ref,
        familyRefFrac: fam.refFrac,
        pairIdx,
        selected: false, paired: false
      });
    });
  });

  cards = shuffle(cards);
  renderCards();
  updateAideBtn();
}

function resetRound() {
  cards.forEach(c => { c.selected=false; c.paired=false; });
  selected=null; pairsFound=0; aideLevel=0;
  hideFeedback(); hideEquivMsg(); hideAide();
  renderCards(); updateAideBtn();
}

// ═══════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════
function renderCards() {
  document.getElementById('cards-grid').innerHTML = cards.map((c, i) => {
    let cls = 'frac-card';
    if (c.paired)        cls += ' paired';
    else if (c.selected) cls += ' selected';
    return `<div class="${cls}" id="card_${i}" onclick="clickCard(${i})">
      <div class="pair-badge">✓</div>
      <div class="card-figure">${drawBande(c.n, c.d, 110, 38)}</div>
      <div class="frac-write">
        <span class="fn">${c.n}</span>
        <span class="fd">${c.d}</span>
      </div>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════
//  CLIC-CLIC
// ═══════════════════════════════════════════
function clickCard(i) {
  const card = cards[i];
  if (card.paired) return;

  // Deselectioner si meme carte
  if (selected === i) {
    card.selected = false;
    selected = null;
    hideAide(); aideLevel = 0;
    renderCards(); updateAideBtn();
    return;
  }

  // Premiere selection
  if (selected === null) {
    card.selected = true;
    selected = i;
    hideAide(); aideLevel = 0;
    renderCards(); updateAideBtn();
    return;
  }

  // Deuxieme selection — test paire
  const cardA = cards[selected];
  const cardB = card;

  if (cardA.familyId === cardB.familyId) {
    // CORRECT
    cardA.paired = true; cardB.paired = true;
    cardA.selected = false; cardB.selected = false;
    selected = null; pairsFound++;
    hideAide(); aideLevel = 0;
    showEquivMsg(cardA, cardB);
    renderCards(); updateAideBtn();
    if (pairsFound === nbPaires) {
      setTimeout(() => {
        score++; total++;
        showFeedback('Bravo ! Toutes les paires equivalentes sont trouvees !', 'ok');
        updateScore();
      }, 600);
    }
  } else {
    // INCORRECT — flash rouge
    cardB.selected = true;
    renderCards();
    setTimeout(() => {
      document.getElementById('card_' + selected)?.classList.add('wrong-flash');
      document.getElementById('card_' + i)?.classList.add('wrong-flash');
    }, 10);
    setTimeout(() => {
      cardA.selected = false; cardB.selected = false;
      selected = null;
      renderCards(); updateAideBtn();
    }, 700);
  }
}

// ═══════════════════════════════════════════
//  AIDE PROGRESSIVE
// ═══════════════════════════════════════════
function updateAideBtn() {
  const btn = document.getElementById('btn-aide');
  // Bouton visible seulement si une carte est selectionnee
  if (selected !== null && !cards[selected]?.paired) {
    btn.classList.add('visible');
    // Libelle selon niveau suivant
    const next = aideLevel + 1;
    btn.innerHTML = next === 1 ? '💡 Aide' : next === 2 ? '💡 Aide (2/3)' : '💡 Aide (3/3)';
  } else {
    btn.classList.remove('visible');
  }
}

function showAide() {
  if (selected === null) return;
  const card = cards[selected];
  if (!card || card.paired) return;

  aideLevel = Math.min(aideLevel + 1, 3);
  const panel = document.getElementById('aide-panel');
  const lvlEl = document.getElementById('aide-level');
  const txtEl = document.getElementById('aide-text');
  const figEl = document.getElementById('aide-figure');

  panel.classList.add('show');
  figEl.innerHTML = '';

  if (aideLevel === 1) {
    lvlEl.textContent = 'Indice 1 / 3';
    txtEl.innerHTML = `Cette fraction vaut la meme chose qu'<strong>${card.familyRef}</strong>.<br>Cherche une autre fraction qui represente aussi <strong>${card.familyRef}</strong>.`;
  }

  if (aideLevel === 2) {
    lvlEl.textContent = 'Indice 2 / 3 — Regarde la bande';
    txtEl.innerHTML = `Voici <strong>${card.n}/${card.d}</strong> sur une grande bande :<br>
      <span style="font-size:12px;color:#7A5C20">${card.n} part${card.n>1?'s':''} coloree${card.n>1?'s':''} sur ${card.d} au total</span>`;
    // Bande agrandie
    figEl.innerHTML = drawBande(card.n, card.d, 300, 44);
  }

  if (aideLevel === 3) {
    lvlEl.textContent = 'Indice 3 / 3 — Le secret des fractions egales';
    // Calcul du multiplicateur entre la fraction et la ref
    const ref = card.familyRefFrac;
    const mult = card.d / ref.d;
    if (Number.isInteger(mult) && mult > 1) {
      txtEl.innerHTML = `
        <strong>${ref.n}/${ref.d}</strong> et <strong>${card.n}/${card.d}</strong> sont egales car :<br>
        ${ref.n} &times; ${mult} = ${card.n} &nbsp;&nbsp;et&nbsp;&nbsp; ${ref.d} &times; ${mult} = ${card.d}<br>
        <span style="font-size:12px;color:#7A5C20">On multiplie le numerateur ET le denominateur par le meme nombre → la fraction ne change pas !</span>`;
    } else {
      // Cas fraction reference elle-meme
      const mult2 = ref.d / card.d;
      txtEl.innerHTML = `
        <strong>${card.n}/${card.d}</strong> et <strong>${ref.n}/${ref.d}</strong> sont egales car :<br>
        ${card.n} &times; ${mult2} = ${ref.n} &nbsp;&nbsp;et&nbsp;&nbsp; ${card.d} &times; ${mult2} = ${ref.d}<br>
        <span style="font-size:12px;color:#7A5C20">On multiplie le numerateur ET le denominateur par le meme nombre → la fraction ne change pas !</span>`;
    }
  }

  // Mettre a jour le bouton
  updateAideBtn();
}

function hideAide() {
  document.getElementById('aide-panel').classList.remove('show');
  document.getElementById('aide-figure').innerHTML = '';
}

// ═══════════════════════════════════════════
//  DRAW BANDE
// ═══════════════════════════════════════════
function drawBande(n, d, W, H) {
  const pw = W / d;
  let r = '';
  for (let i = 0; i < d; i++)
    r += `<rect x="${(i*pw).toFixed(2)}" y="0" width="${(pw-.5).toFixed(2)}" height="${H}"
      fill="${i<n?FILL:EMPTY}" stroke="${STR}" stroke-width="1.4"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}">${r}</svg>`;
}

// ═══════════════════════════════════════════
//  FEEDBACK
// ═══════════════════════════════════════════
function showEquivMsg(a, b) {
  const msg = document.getElementById('equiv-msg');
  msg.textContent = `${a.n}/${a.d} = ${b.n}/${b.d} — c'est la meme quantite !`;
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2500);
}
function hideEquivMsg() { document.getElementById('equiv-msg').classList.remove('show'); }
function showFeedback(m,t) { const f=document.getElementById('feedback'); f.textContent=m; f.className='feedback '+t; }
function hideFeedback()    { const f=document.getElementById('feedback'); f.className='feedback'; f.textContent=''; }
function showError(m)  { const e=document.getElementById('config-error'); e.textContent=m; e.style.display='block'; }
function hideError()   { document.getElementById('config-error').style.display='none'; }
function updateScore() { document.getElementById('score-lbl').textContent=`Score : ${score} / ${total}`; }

// ═══════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════
buildFamiliesPanel();
newGame();
</script>
</body>
</html>
